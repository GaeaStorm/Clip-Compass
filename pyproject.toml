[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clip-compass"
version = "0.1.0"
description = "Map and explain CLIP image embedding spaces."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<2.1",
]

[project.optional-dependencies]
clip = [
  "pillow>=10,<12",
  "torch>=2.2,<3",
  "transformers>=4.41,<5",
]
coco = [
  "pillow>=10,<12",
  "pycocotools>=2.0.7,<3",
]
agent = [
  "openai>=2,<3",
  "pydantic>=2,<3",
]
mapper = [
  "kmapper>=2.1,<3",
  "kneed>=0.8,<1",
  "scikit-learn>=1.4,<2",
]

[project.scripts]
clip-compass = "clip_compass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
