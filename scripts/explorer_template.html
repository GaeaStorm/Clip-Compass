      <p class="small muted">If the object didn't matter, it would land somewhere in the middle of the ${K}, about ${Math.round(K / 2)}. North-south is stretched ${compassStretch}× compared with east-west so you can see it: one idea is only a thin slice of CLIP's 512 directions.</p>
      <details class="raw"><summary>The numbers behind this photo</summary>
        <table class="rawt num">
          <tr><th></th><th>Match to the sentence</th><th>Rank of 25</th></tr>
          <tr><td>Original</td><td>${info.m0.toFixed(3)}</td><td>#${info.rO}</td></tr>
          <tr><td>Object hidden</td><td>${p.target.match.toFixed(3)}</td><td>#${info.rT}</td></tr>
          <tr><td>Typical random patch</td><td>${info.mC.toFixed(3)}</td><td>#${info.rC}</td></tr>
        </table>
        <p class="small" style="margin-top:8px">Match is CLIP's cosine similarity between photo and sentence; for photos against text it usually sits between 0.15 and 0.35, so small differences matter. "Typical" is the middle of the ${K} random patches.</p>
      </details>`;
  },
  group() {
    const n = nodeById[state.node], list = pairsOf(n.id), v = n.verdict;
    if (!v) { $("#groupVerdict").innerHTML = ""; return; }
    const alpha = DATA.verdictConfig.alpha;
    const testRow = (name, title, c) => {
      const t = v.tests[name];
      if (!t) return "";
      const pass = t.q != null && t.q <= alpha;
      return `<div class="testline">
        <div><div class="label">${title}</div><div class="small">On average the object beat <b>${pct(t.pct)}%</b> of the random patches across ${plural(t.n, "photo")}. Chance of a fluke: <b>${luck(t.q)}</b>.</div></div>
        <div class="pctbar" style="--c:${c}"><i style="width:${pct(t.pct)}%"></i><span class="mid" title="where luck would land"></span></div>
        <span class="pill" style="--c:${pass ? "var(--good)" : "var(--bad)"}"><i>${pass ? "✓" : "✕"}</i>${pass ? "Passes" : "Doesn't pass"}</span>
      </div>`;
    };
    const cards = list.map(q => {
      if (!testable(q)) return `<button class="card out" data-pair="${q.id}" aria-pressed="${q.id === state.pair}"><span class="top"><img src="${items[q.item].thumb}" alt=""><span class="small">${SKIP[q.status].short}<br><span class="muted">not tested</span></span></span></button>`;
      return `<button class="card" data-pair="${q.id}" aria-pressed="${q.id === state.pair}">
        <span class="top"><img src="${items[q.item].thumb}" alt=""><span class="small">${esc(objName(q))}<br><span class="muted">tested</span></span></span>
        <span class="mini-row"><span class="label">Idea</span>${strip(q.ranks.prompt, "var(--hidden)")}<b class="num">${q.ranks.prompt}</b></span>
        <span class="mini-row"><span class="label">Group</span>${strip(q.ranks.centroid, "var(--joe)")}<b class="num">${q.ranks.centroid}</b></span>
      </button>`;
    }).join("");
    const differs = n.engineLabel && n.engineLabel !== v.label;
    $("#groupVerdict").innerHTML = `
      <div class="row" style="justify-content:space-between;align-items:flex-start;gap:18px">
        <div class="stack" style="gap:4px;max-width:62ch">
          <div class="label">The verdict for group ${groupNo(n.id)}</div>
          <h2>"${esc(n.name)}"</h2>
          <p class="small">${LABEL[v.label].long} ${REASON[v.reason] ? REASON[v.reason](v) : ""}</p>
        </div>
        ${verdictPill(v.label, true)}
      </div>
      ${testRow("centroid", "Pushes photos out of the group", "var(--joe)")}
      ${testRow("prompt", "Makes CLIP see less of the idea", "var(--hidden)")}
      <div class="board">${cards}</div>
      <div class="split even" style="align-items:start">
        <div class="note"><span class="ic">?</span><span><b>How can 4 photos be enough?</b> Each photo races ${K} random patches. If the object didn't matter, finishing near the top in one photo would be a long shot, and doing it in photo after photo even more so. The test adds up every photo's placing and works out exactly how unlikely that total is by luck, then corrects for testing several guesses at once.</span></div>
        ${differs ? `<div class="note"><span class="ic">⇄</span><span><b>Dhruv's engine said "${LABEL[n.engineLabel].text.toLowerCase()}".</b> It judges each photo alone (the object has to beat ${K - 1} of ${K} patches) and then takes a majority vote, so steady but smaller wins don't count. The combined test uses every photo's full placing.</span></div>` : ""}
      </div>`;
  },
  click(t) {
    if (t.dataset.node) {
      state.node = t.dataset.node;
      $$(".pick").forEach(b => b.setAttribute("aria-pressed", b.dataset.node === state.node));
      VIEWS.hide.ensurePair(); this.draw(); return true;
    }
    const pr = t.closest("[data-pair]");
    if (pr) { state.pair = pr.dataset.pair; this.draw(); return true; }
  },
};

VIEWS.verdict = {
  html() {
    const s = stageById.verdict;
    const textPass = nodes.filter(x => x.baseline && x.baseline.accepted).length;
    const count = label => nodes.filter(x => x.verdict && x.verdict.label === label).length;
    const rows = nodes.map((n, k) => {
      const v = n.verdict, b = n.baseline;
      const disagree = b && b.accepted && v && v.label === "not_supported";
      const tests = v && v.tests.centroid ? `<span class="small num">group ${pct(v.tests.centroid.pct)}% · idea ${pct(v.tests.prompt.pct)}%</span>` : `<span class="small">${v && REASON[v.reason] ? ({ low_coverage: `visible in ${v.visible} of ${v.members}`, too_few_testable_members: `${v.testable} testable`, no_effect: "no effect", unknown_categories: "unknown object" })[v.reason] : ""}</span>`;
      return `
        <div class="nmcell"><img src="${items[n.members[0]].thumb}" alt=""><span><span class="label">Group ${k + 1}</span><br><b>${esc(n.name)}</b>${disagree ? `<br><span class="flag">⚑ The checks disagree</span>` : ""}</span></div>
        <div><span class="pill" style="--c:var(--ink-3)"><i>?</i>Yes, ${n.confidence == null ? "–" : pct(n.confidence) + "% sure"}</span></div>
        <div>${b ? `<span class="pill" style="--c:${b.accepted ? "var(--good)" : "var(--bad)"}"><i>${b.accepted ? "✓" : "✕"}</i>${b.accepted ? "Pass" : "Fail"}</span><span class="small num">${pct(b.auroc)} in 100</span>` : "–"}</div>
        <div>${v ? verdictPill(v.label) : "–"}${tests}</div>`;
    }).join("");
    const flipped = nodes.find(n => n.verdict && n.engineLabel && n.engineLabel !== n.verdict.label);
    const lowCov = nodes.filter(n => n.verdict && n.verdict.reason === "low_coverage").length;
    return `<div class="sheet">
      ${head(s, "So what can we conclude?", `This run uses hand-written guesses and 25 photos, so it shows <b>how the method behaves</b>, not findings. Even so, the three judges already disagree in ways that matter, and those disagreements are what the project is about.`)}
      <section class="panel" style="padding:8px 22px 4px">
        <div class="score-scroll"><div class="score">
          <div class="hd">Hypothesis</div>
          <div class="hd">Judge 1<b>The AI itself</b></div>
          <div class="hd">Judge 2<b>Quick text check</b></div>
          <div class="hd">Judge 3<b>Masking test</b></div>
          ${rows}
        </div></div>
      </section>
      <p class="small muted">Masking test figures: on average, how many of the ${K} random patches the object beat at pushing photos out of their group ("group") and at making CLIP see less of the idea ("idea"). Luck would land near 50%.</p>
      <section class="stack">
        <h2>Three things this run taught us</h2>
        <div class="lessons">
          <div class="panel lesson"><span class="k">01</span><h3>The quick check says yes to everything</h3><p class="small">It passed ${textPass} of ${nodes.length} guesses. The masking test supported ${count("supported")}. A check that never says no can't separate good explanations from bad ones.</p><button class="btn" data-go="text-check" style="align-self:flex-start">See the line-up</button></div>
          <div class="panel lesson"><span class="k">02</span><h3>Evidence has to be added up across photos</h3><p class="small">${flipped ? `For "${esc(flipped.name)}", judging each photo alone and voting said "${LABEL[flipped.engineLabel].text.toLowerCase()}". Adding up every photo's placing shows the object beat ${pct(flipped.verdict.tests.centroid.pct)}% of random patches at pushing photos out of the group, steadily enough to be ${LABEL[flipped.verdict.label].text.toLowerCase()}.` : "Each photo alone is a noisy race against random patches; the combined test is what makes small, steady effects count."}</p><button class="btn" data-go="verify" style="align-self:flex-start">Open the compass</button></div>
          <div class="panel lesson"><span class="k">03</span><h3>Most guesses name something the group doesn't show</h3><p class="small">${lowCov} of ${nodes.length} guesses name an object visible in under half of their group's photos, so it can't be what defines the group. A good agent should be pushed towards objects the whole group shares.</p><button class="btn" data-go="hide" style="align-self:flex-start">See which photos were tested</button></div>
        </div>
      </section>
      <section class="panel stack" style="border-color:var(--ink)">
        <div class="label">What the finished project will show</div>
        <h2>How often does the quick check accept an explanation that the masking test rejects?</h2>
        <p style="max-width:70ch">With the real agent and a few hundred photos, every group gets enough tested photos for a firm verdict. Then we count the disagreements between the judges. If the masking test rejects explanations the text check let through, we've shown that checking by perturbation catches convincing-but-wrong explanations. That's the result for the report.</p>
        <div class="label" style="margin-top:6px">What's needed to get there</div>
        <ul class="todo-list">
          <li><span class="avatar" style="--c:var(--gayatri)">G</span><span>Run the real AI agent on a few hundred photos</span></li>
          <li><span class="avatar" style="--c:var(--dhruv)">D</span><span>Agree the hand-over format and review the leave-one-out centre change</span></li>
          <li><span class="avatar" style="--c:var(--joe)">J</span><span>Run the verdict test and the text check on the full set</span></li>
          <li><span class="avatar" style="--c:var(--team)">✦</span><span>Agree what counts as a "correct" explanation, then write it up</span></li>
        </ul>
      </section>
      ${footer(s, "First results on test data. Rebuild this page with scripts/build_explorer.py whenever a new run lands.")}
    </div>`;
  },
};

// ================= small utilities
function fitXY(points, W, H, pad) {
  const xs = points.map(p => p[0]), ys = points.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const s = Math.min((W - 2 * pad) / (x1 - x0 || 1), (H - 2 * pad) / (y1 - y0 || 1));
  const ox = (W - s * (x1 - x0)) / 2, oy = (H - s * (y1 - y0)) / 2;
  return { px: p => [ox + (p[0] - x0) * s, H - (oy + (p[1] - y0) * s)] };
}
function hexRgb(h) {
  h = h.replace("#", "");
  if (h.length === 3) h = h.split("").map(c => c + c).join("");
  return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
}
const tip = $("#tip");
function showTip(e, html) {
  tip.innerHTML = html; tip.style.opacity = 1;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 10) + "px";
  tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 10) + "px";
}
function hideTip() { tip.style.opacity = 0; }
document.addEventListener("mouseover", e => {
  const t = e.target.closest("[data-tipphoto]");
  if (!t) return;
  const it = items[+t.dataset.tipphoto], n = nodeById[state.node];
  const inside = n && n.members.includes(+t.dataset.tipphoto);
  showTip(e, `${inside ? `<b>In group ${groupNo(n.id)}</b><br>` : ""}${esc(it.captions[0].slice(0, 140))}…`);
  t.addEventListener("mouseleave", hideTip, { once: true });
});

// ================= router
let current = null;
function go(id, push = true) {
  if (!VIEWS[id]) id = "overview";
  if (current && VIEWS[current].unmount) VIEWS[current].unmount();
  state.stage = id; current = id;
  const view = $("#view");
  view.innerHTML = VIEWS[id].html();
  if (VIEWS[id].mount) VIEWS[id].mount();
  renderRail();
  if (push && location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
  window.scrollTo({ top: 0 });
  const active = $(".step[aria-current]");
  if (active && innerWidth <= 900) active.scrollIntoView({ inline: "center", block: "nearest" });
}
document.addEventListener("click", e => {
  const goBtn = e.target.closest("[data-go]");
  if (goBtn) { go(goBtn.dataset.go); return; }
  const person = e.target.closest("[data-person]");
  if (person) { state.person = state.person === person.dataset.person ? null : person.dataset.person; renderRail(); return; }
  const v = VIEWS[current];
  if (v && v.click) {
    const t = e.target.closest("[data-node],[data-pair],[data-edit],[data-photo]");
    if (t) v.click(t);
  }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("g[role=button]")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
});
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id !== current) go(id, false); });
window.addEventListener("resize", () => drawTrack());
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => go(current, false));
document.fonts && document.fonts.ready.then(() => drawTrack());
go(location.hash.slice(1) || "overview", false);
</script>
